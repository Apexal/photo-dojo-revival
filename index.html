<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d1240" />
    <title>Foto Fighter</title>
    <meta name="description" content="A free couch fighting game made of your own photos: snap yourself with a webcam or phone, then fight a friend on the same screen. Local multiplayer in the browser, no accounts, no uploads." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Foto Fighter" />
    <meta property="og:description" content="A free couch fighting game made of your own photos: two players, one screen, in the browser." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/game/game.css" />
  </head>
  <body>
    <div id="game"></div>
    <div id="toolbar" hidden>
      <button type="button" data-action="import">Import fighter file</button>
      <button type="button" data-action="export-all">Export all fighters</button>
      <button type="button" data-action="fullscreen" id="fullscreen-button">⛶ Fullscreen (F)</button>
      <input type="file" id="import-file" accept=".fotofighter,.photodojo,application/zip" hidden />
      <span id="toolbar-status" role="status"></span>
      <a href="/about" target="_blank" rel="noopener">About · FAQ · Credits</a>
      <a href="/about#feedback" target="_blank" rel="noopener">Bugs &amp; ideas</a>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
