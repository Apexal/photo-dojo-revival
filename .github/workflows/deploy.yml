# Test on every push/PR; on main, deploy the static site to Cloudflare Pages and the signaling Worker.
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Repo variables: VITE_SIGNALING_URL (e.g. wss://photo-dojo-signaling.<subdomain>.workers.dev),
#                 PAGES_PROJECT (Cloudflare Pages project name, default "photo-dojo"),
#                 SITE_URL (the site's public URL, e.g. https://photo-dojo.pages.dev: absolute link-preview images),
#                 VITE_MUSIC_BASE_URL (public URL of the R2 bucket/folder holding the music files).
name: test-and-deploy
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm ci --prefix worker
      - name: Deploy signaling Worker
        run: npx --prefix worker wrangler deploy --config worker/wrangler.toml
      - name: Build site
        run: npm run build
        env:
          VITE_SIGNALING_URL: ${{ vars.VITE_SIGNALING_URL }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_MUSIC_BASE_URL: ${{ vars.VITE_MUSIC_BASE_URL }}
      - name: Deploy to Cloudflare Pages
        run: npx --prefix worker wrangler pages deploy dist --project-name "${{ vars.PAGES_PROJECT || 'photo-dojo' }}" --branch main
